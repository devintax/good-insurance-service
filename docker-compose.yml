version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: good-insurance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: leads
      POSTGRES_USER: leadsadmin
      POSTGRES_PASSWORD: leads123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadsadmin -d leads"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: good-insurance-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://leadsadmin:leads123@postgres:5432/leads
      ERPNEXT_URL: ${ERPNEXT_URL:-https://erpnext.dfgworld.net}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      ERPNEXT_LEAD_OWNER: ${ERPNEXT_LEAD_OWNER:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data: